# Live push for the Carva dashboard — nginx half.
#
# Paste both blocks into /etc/nginx/conf.d/gps.carvarent.com.conf on the VPS:
# the `map` at the TOP of the file (http context, outside every `server`), and
# the `location` inside the HTTPS `server` block. Then:
#
#   nginx -t && systemctl reload nginx
#
# Never reload without `nginx -t` passing first — a syntax error in this file
# takes the whole vhost down, dashboard included.
#
#
# WHY THIS EXISTS
#
# The dashboard used to ask Traccar for every device and position every 5
# seconds. Traccar can instead PUSH each fix the moment it lands, over a
# WebSocket at /api/socket — but a Next.js route handler cannot proxy an HTTP
# upgrade, so /api/traccar/* can never carry it. nginx has to join the two
# ends directly, which is all this does.
#
# The browser authenticates with an httpOnly `JSESSIONID` cookie scoped to
# this exact path, issued by /api/auth/login and /api/auth/session (see
# `socketCookieOptions` in apps/web/lib/auth.ts). Traccar then scopes the
# stream to that user's own devices, so this endpoint exposes nothing the
# existing proxy does not already allow.


# ---------------------------------------------------------------- http context
#
# Belt and braces on top of SameSite=Lax: a WebSocket handshake is exempt from
# CORS, so without a check any page on the internet could try to open an
# authenticated stream in a logged-in browser. An absent Origin is allowed on
# purpose — native clients (the Expo app) do not send one.
map $http_origin $carva_socket_origin_ok {
    default                      0;
    ""                           1;
    "https://gps.carvarent.com"  1;
}


# ------------------------------------------------- inside the HTTPS server {}
#
# `location =` is an EXACT match, so this proxies one single path and no
# subpath can be smuggled through it toward the rest of Traccar's API.
location = /traccar-socket {
    if ($carva_socket_origin_ok = 0) {
        return 403;
    }

    proxy_pass http://127.0.0.1:8082/api/socket;

    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # A parked fleet sends nothing for long stretches, and nginx's 60s default
    # would read that silence as a dead upstream and close the socket. The
    # client reconnects either way, but an hour keeps it from churning.
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;

    # Frames are small and latency is the whole point.
    proxy_buffering off;
}
